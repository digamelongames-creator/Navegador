name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Descomprimir proyecto
        run: unzip -o -q Navegador.zip -d proyecto
      - name: Compilar
        working-directory: proyecto/Navegador
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Navegador-apk
          path: proyecto/Navegador/app/build/outputs/apk/debug/app-debug.apk
