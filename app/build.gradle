plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diego.navegador'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diego.navegador'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Clave fija: así cada APK nuevo se instala encima del anterior sin perder tu lista.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
